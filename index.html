<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tapoカメラ 導入ガイド</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Core -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap');
        
        :root {
            --brand-main: #215387;
            --brand-main-light: #3174b5;
            --brand-base: #eef8ff;
            --brand-accent: #d7f0ff;
            --brand-danger: #ea433c;
            --brand-text: #1e293b;
        }

        body { 
            font-family: 'Noto Sans JP', sans-serif; 
            background-color: #f8fafc;
            color: var(--brand-text);
        }
        
        .progress-transition { transition: width 0.8s cubic-bezier(0.65, 0, 0.35, 1); }
        .lucide { vertical-align: middle; }
        
        input:focus { border-color: var(--brand-main); outline: none; box-shadow: 0 0 0 3px rgba(33, 83, 135, 0.1); }

        .glass-header {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(8px);
        }

        .sticky-report-bar {
            background: rgba(255, 255, 255, 0.95);
            box-shadow: 0 -10px 25px -5px rgba(33, 83, 135, 0.1);
            backdrop-filter: blur(12px);
        }

        .modal-overlay { background: rgba(15, 23, 42, 0.5); backdrop-filter: blur(6px); }
        
        .card-shadow {
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
        }

        .scrollbar-thin::-webkit-scrollbar { width: 6px; }
        .scrollbar-thin::-webkit-scrollbar-track { background: transparent; }
        .scrollbar-thin::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const Icon = ({ name, size = 20, className = "" }) => {
            useEffect(() => { if (window.lucide) window.lucide.createIcons(); }, [name]);
            return <i data-lucide={name} style={{ width: size, height: size }} className={className}></i>;
        };

        const initialTaskData = [
            { id: 1, phase: 1, title: 'カメラ本体 (Tapo C410) のご購入', completed: false, description: 'バッテリー駆動の防犯カメラです。必要台数をお手配ください。', links: [{ label: '公式サイトで確認', url: 'https://www.tp-link.com/jp/home-networking/cloud-camera/tapo-c410/' }] },
            { id: 2, phase: 1, title: 'ソーラーパネル (Tapo A201) のご購入', completed: false, description: '屋外設置の場合は必須です。', isOptional: true, links: [{ label: '公式サイトで確認', url: 'https://www.tp-link.com/jp/home-networking/cloud-camera/tapo-a201/' }] },
            { id: 3, phase: 1, title: '適切なmicroSDカードのご準備', completed: false, description: '4GB〜512GB。※SAMSUNG/TOPESEL製は故障の原因となるため使用禁止です。', isCritical: true, links: [{ label: '互換性の詳細を確認', url: 'https://www.tp-link.com/support/faq/3048/' }] },
            { id: 4, phase: 1, title: '施工会社様へのご依頼・お手配', completed: false, description: '設置工事が必要な場合は、以下の提携先または任意の業者様へご連絡ください。', inquiryLinks: [{ label: '株式会社大志（メール）', url: 'mailto:capital.design.chiba@gmail.com', icon: 'mail' }, { label: '株式会社MarkAnt（Web）', url: 'https://www.markant.jp/', icon: 'globe' }] },
            { id: 5, phase: 2, title: 'Tapoアプリのインストール', completed: false, description: 'スマートフォンのストアからアプリをインストールしてください。', links: [{ label: 'iOS', url: 'https://apps.apple.com/jp/app/tp-link-tapo/id1472718009' }, { label: 'Android', url: 'https://play.google.com/store/apps/details?id=com.tplink.iot' }] },
            { id: 6, phase: 2, title: 'Wi-Fi環境のご確認', completed: false, description: '2.4GHz帯、WPA/WPA2、DHCP設定が有効であることをご確認ください。' },
            { id: 7, phase: 2, title: 'デバイスの登録・セットアップ', completed: false, description: 'アプリの指示に従い、カメラをネットワークに接続してください。', links: [{ label: 'セットアップ手順を確認', url: 'https://www.tapo.com/jp/faq/51/' }] },
            { id: 8, phase: 3, title: 'TapoCare サービスのご契約（必須）', completed: false, description: 'クラウドサービスをご利用いただくため、契約が必須となります。', links: [{ label: 'ご契約方法を確認', url: 'https://www.tp-link.com/jp/support/faq/3257/' }] },
            { id: 9, phase: 3, title: '管理権限の共有（弊社ご案内後に実施）', completed: false, description: '契約締結後、弊社よりご案内したタイミングで実施してください。', isConditional: true, links: [{ label: '共有手順を確認', url: 'https://www.tp-link.com/jp/support/faq/2613/' }] }
        ];

        const App = () => {
            const [tasks, setTasks] = useState(() => {
                const saved = localStorage.getItem('tapo_checklist_data_v2.6');
                return saved ? JSON.parse(saved) : initialTaskData;
            });
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [reportType, setReportType] = useState('initial');
            const [formData, setFormData] = useState(() => {
                const saved = localStorage.getItem('tapo_form_data_v2.6');
                return saved ? JSON.parse(saved) : { propertyName: '', subscriberName: '', staffName: '', email: '', tpLinkId: '', password: '', indoorCount: 0, outdoorCount: 0 };
            });

            useEffect(() => {
                localStorage.setItem('tapo_checklist_data_v2.6', JSON.stringify(tasks));
                localStorage.setItem('tapo_form_data_v2.6', JSON.stringify(formData));
                if (window.lucide) window.lucide.createIcons();
            }, [tasks, formData]);

            const toggleTask = (id) => {
                setTasks(tasks.map(t => t.id === id ? { ...t, completed: !t.completed } : t));
            };

            const progress = Math.round((tasks.filter(t => t.completed).length / tasks.length) * 100);
            const isInitialDone = useMemo(() => tasks.filter(t => t.id < 9).every(t => t.completed), [tasks]);
            const isFinalDone = useMemo(() => tasks.find(t => t.id === 9).completed, [tasks]);
            const totalCameras = (parseInt(formData.indoorCount) || 0) + (parseInt(formData.outdoorCount) || 0);

            const openReportModal = (type) => {
                setReportType(type);
                setIsModalOpen(true);
            };

            const handleSendEmail = () => {
                const isFinal = reportType === 'final';
                const subjectText = isFinal 
                    ? `【権限共有完了】Tapoカメラ管理権限付与完了（${formData.propertyName}）`
                    : `【導入完了報告】Tapoカメラ設置完了（${formData.propertyName}）`;
                
                const statusMessage = isFinal
                    ? `Tapoカメラの管理権限の付与設定（共有設定）が完了しました。`
                    : `Tapoカメラの導入について、クラウドサービス（TapoCare）の契約まで完了しましたので報告いたします。`;

                const subject = encodeURIComponent(subjectText);
                let bodyContent = `民泊管理バンク 担当者様\n\n` +
                    `お世話になっております。\n` +
                    `${statusMessage}\n\n` +
                    `■ホスト様情報\n` +
                    `物件名: ${formData.propertyName}\n` +
                    `契約者名: ${formData.subscriberName}\n` +
                    `担当者名: ${formData.staffName}\n` +
                    `連絡先メールアドレス: ${formData.email}\n\n`;

                if (!isFinal) {
                    bodyContent += `■設置台数\n` +
                        `屋内カメラ: ${formData.indoorCount}台\n` +
                        `屋外カメラ(ソーラー): ${formData.outdoorCount}台\n` +
                        `合計台数: ${totalCameras}台\n\n` +
                        `■アカウント情報\n` +
                        `TP-Link ID (Email): ${formData.tpLinkId}\n` +
                        `パスワード: ${formData.password}\n\n`;
                }

                bodyContent += `ご確認のほど、よろしくお願いいたします。`;
                window.location.href = `mailto:capital.design.chiba@gmail.com?subject=${subject}&body=${encodeURIComponent(bodyContent)}`;
                setIsModalOpen(false);
            };

            return (
                <div className="min-h-screen pb-32">
                    {/* Sticky Header */}
                    <div className="sticky top-0 z-30 glass-header border-b border-slate-200">
                        <div className="max-w-4xl mx-auto px-4 py-5 md:py-7 flex flex-col md:flex-row md:items-center justify-between gap-4">
                            <div className="flex items-center gap-4">
                                <div className="bg-[#215387] p-2.5 rounded-2xl shadow-lg shadow-blue-900/10">
                                    <Icon name="shield-check" size={24} className="text-white" />
                                </div>
                                <div>
                                    <h1 className="text-xl md:text-2xl font-black text-slate-800 tracking-tight leading-none">Tapoカメラ 導入ガイド</h1>
                                    <p className="text-slate-400 text-[10px] md:text-xs font-bold mt-1 tracking-wider">民泊管理バンク・ホスト様用タスク管理シート</p>
                                </div>
                            </div>
                            <div className="flex items-center gap-4 bg-white px-5 py-2.5 rounded-2xl border border-slate-100 shadow-sm min-w-[220px]">
                                <div className="text-[10px] font-black text-slate-300 uppercase tracking-widest leading-none">Task Completion</div>
                                <div className="flex-1 h-2 bg-slate-50 rounded-full overflow-hidden">
                                    <div className="h-full bg-gradient-to-r from-[#215387] to-[#3174b5] progress-transition" style={{ width: `${progress}%` }}></div>
                                </div>
                                <span className="text-[#215387] font-black text-sm w-10 text-right leading-none">{progress}%</span>
                            </div>
                        </div>
                    </div>

                    <div className="max-w-4xl mx-auto p-4 md:p-8 space-y-10 mt-4">
                        
                        {/* Host Info Card */}
                        <div className="bg-white rounded-[32px] shadow-sm border border-slate-200 overflow-hidden card-shadow">
                            <div className="bg-[#f8fafc] px-8 py-5 border-b border-slate-100 flex justify-between items-center">
                                <h2 className="text-slate-700 font-black text-base flex items-center gap-2">
                                    <Icon name="user" size={18} className="text-[#215387]" /> ホスト様情報
                                </h2>
                                <span className="text-slate-400 text-[9px] font-bold tracking-widest uppercase">Required Info</span>
                            </div>
                            <div className="p-8 grid grid-cols-1 md:grid-cols-2 gap-8">
                                <div className="md:col-span-2">
                                    <label className="block text-[11px] font-black text-slate-400 mb-2 uppercase tracking-widest leading-none">物件名</label>
                                    <input type="text" value={formData.propertyName} onChange={e => setFormData({...formData, propertyName: e.target.value})} className="w-full bg-slate-50/50 border border-slate-200 rounded-2xl px-5 py-4 font-bold text-slate-700 transition-all" placeholder="例：渋谷マンション301" />
                                </div>
                                <div>
                                    <label className="block text-[11px] font-black text-slate-400 mb-2 uppercase tracking-widest leading-none">ご契約者様名</label>
                                    <input type="text" value={formData.subscriberName} onChange={e => setFormData({...formData, subscriberName: e.target.value})} className="w-full bg-slate-50/50 border border-slate-200 rounded-2xl px-5 py-4 font-bold text-slate-700 transition-all" placeholder="個人名または会社名" />
                                </div>
                                <div>
                                    <label className="block text-[11px] font-black text-slate-400 mb-2 uppercase tracking-widest leading-none">担当者名</label>
                                    <input type="text" value={formData.staffName} onChange={e => setFormData({...formData, staffName: e.target.value})} className="w-full bg-slate-50/50 border border-slate-200 rounded-2xl px-5 py-4 font-bold text-slate-700 transition-all" placeholder="ご担当者様名" />
                                </div>
                                <div className="md:col-span-2">
                                    <label className="block text-[11px] font-black text-slate-400 mb-2 uppercase tracking-widest leading-none">連絡先メールアドレス</label>
                                    <input type="email" value={formData.email} onChange={e => setFormData({...formData, email: e.target.value})} className="w-full bg-slate-50/50 border border-slate-200 rounded-2xl px-5 py-4 font-bold text-slate-700 transition-all" placeholder="example@minpaku.com" />
                                </div>
                            </div>
                        </div>

                        {/* microSD Warning */}
                        <div className="bg-[#fff4f4] border-l-4 border-[#ea433c] p-6 rounded-r-[32px] flex gap-5 items-start shadow-sm border border-red-50">
                            <div className="bg-[#ea433c] p-1.5 rounded-lg shadow-lg shadow-red-500/20 shrink-0">
                                <Icon name="alert-triangle" size={20} className="text-white" />
                            </div>
                            <div>
                                <p className="font-black text-red-900 mb-1 text-base tracking-tight leading-tight">microSDカード 厳重警告</p>
                                <p className="text-red-700 leading-relaxed text-[13px] font-medium mt-1">
                                    <strong>SAMSUNG Evo Plus</strong> および <strong>TOPESEL</strong> 製カードは使用禁止です。互換性の問題により、機器を故障させる原因となります。
                                </p>
                            </div>
                        </div>

                        {/* Tasks */}
                        {[1, 2, 3].map(phase => (
                            <div key={phase} className="space-y-4">
                                <div className="flex items-center gap-4 px-2">
                                    <span className="bg-[#d7f0ff] text-[#215387] px-4 py-1.5 rounded-full text-[10px] font-black tracking-[0.2em] uppercase shadow-sm border border-blue-100">Step 0{phase}</span>
                                    <h3 className="font-black text-slate-700 text-base md:text-lg tracking-tight">
                                        {phase === 1 ? '準備・機材調達・工事' : phase === 2 ? 'アプリ設定・カメラ設置' : '運用・管理の開始'}
                                    </h3>
                                </div>
                                <div className="grid grid-cols-1 gap-4">
                                    {tasks.filter(t => t.phase === phase).map(task => (
                                        <div key={task.id} 
                                             onClick={() => toggleTask(task.id)}
                                             className={`group p-6 md:p-8 transition-all duration-300 cursor-pointer flex gap-6 rounded-[32px] border card-shadow ${
                                                 task.completed 
                                                 ? 'bg-[#f0f9ff]/50 border-blue-50 opacity-60' 
                                                 : task.isCritical 
                                                   ? 'bg-[#fffcf0] border-amber-200' 
                                                   : 'bg-white border-slate-100 hover:border-[#215387] hover:translate-y-[-2px]'
                                             }`}>
                                            <div className="shrink-0 mt-1">
                                                {task.completed 
                                                    ? <div className="bg-emerald-500 rounded-xl p-1.5 shadow-md shadow-emerald-500/20 transition-all scale-110"><Icon name="check" size={16} className="text-white" /></div>
                                                    : <div className="border-2 border-slate-100 w-8 h-8 rounded-xl transition-all group-hover:border-[#215387] bg-slate-50/50"></div>
                                                }
                                            </div>
                                            <div className="flex-1">
                                                <div className="flex flex-wrap items-center gap-3 mb-2">
                                                    <span className={`font-black text-base md:text-lg tracking-tight ${task.completed ? 'text-slate-400 line-through' : 'text-slate-800'}`}>{task.title}</span>
                                                    {task.isCritical && !task.completed && <span className="bg-[#ea433c] text-white text-[9px] px-2.5 py-1 rounded-lg font-black uppercase tracking-widest shadow-sm">重要</span>}
                                                    {task.isOptional && !task.completed && <span className="bg-slate-400 text-white text-[9px] px-2.5 py-1 rounded-lg font-black uppercase tracking-widest shadow-sm">任意</span>}
                                                    {task.isConditional && !task.completed && <span className="bg-[#0097e1] text-white text-[9px] px-2.5 py-1 rounded-lg font-black uppercase tracking-widest shadow-sm">案内待ち</span>}
                                                </div>
                                                <p className={`text-[13px] leading-relaxed mb-5 ${task.completed ? 'text-slate-300' : 'text-slate-500 font-medium'}`}>{task.description}</p>
                                                
                                                {!task.completed && (task.links || task.inquiryLinks) && (
                                                    <div className="flex flex-wrap gap-3" onClick={e => e.stopPropagation()}>
                                                        {(task.inquiryLinks || []).map((l, i) => (
                                                            <a key={i} href={l.url} target="_blank" className="flex items-center gap-2.5 px-5 py-3 bg-white border border-slate-100 rounded-2xl font-bold text-[11px] text-slate-600 hover:border-[#215387] hover:bg-slate-50 transition-all card-shadow">
                                                                <Icon name={l.icon === 'mail' ? 'mail' : 'globe'} size={14} className="text-[#215387]" /> {l.label}
                                                            </a>
                                                        ))}
                                                        {(task.links || []).map((l, i) => (
                                                            <a key={i} href={l.url} target="_blank" className="inline-flex items-center gap-2.5 bg-[#215387] text-white text-[11px] px-6 py-3 rounded-2xl font-black hover:bg-[#1a416a] transition-all shadow-lg shadow-blue-900/10">
                                                                {l.label} <Icon name="external-link" size={12} />
                                                            </a>
                                                        ))}
                                                    </div>
                                                )}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        ))}
                    </div>

                    {/* Footer */}
                    <footer className="mt-20 border-t border-slate-100 pt-12 pb-24 text-center space-y-6">
                        <div className="flex justify-center gap-8">
                            <a href="https://www.tp-link.com/jp/support/faq/2742/" target="_blank" className="text-[#215387] font-black text-xs hover:underline flex items-center gap-2 bg-white px-6 py-3 rounded-2xl border border-slate-100 shadow-sm">
                                <Icon name="help-circle" size={16} /> Tapoカメラ よくある質問 (FAQ)
                            </a>
                        </div>
                        <p className="text-slate-300 text-[10px] font-black tracking-[0.3em] uppercase">Tapo Deployment Guide v2.6</p>
                    </footer>

                    {/* Fixed Footer Bar */}
                    {(isInitialDone || isFinalDone) && (
                        <div className="fixed bottom-0 left-0 right-0 p-6 sticky-report-bar z-40 animate-in slide-in-from-bottom duration-500 border-t border-slate-100">
                            <div className="max-w-4xl mx-auto flex flex-col items-center gap-4">
                                <p className="text-[10px] font-black text-slate-400 uppercase tracking-widest flex items-center gap-2">
                                    <Icon name="info" size={12} className="text-[#215387]" /> 本文を編集せずにそのまま送信してください
                                </p>
                                {isFinalDone ? (
                                    <button 
                                        onClick={() => openReportModal('final')}
                                        className="w-full bg-gradient-to-r from-[#0097e1] to-[#007ab7] text-white py-5 rounded-[24px] font-black text-base md:text-lg shadow-xl shadow-blue-500/20 hover:translate-y-[-2px] transition-all flex items-center justify-center gap-4 active:scale-[0.98]"
                                    >
                                        <Icon name="check-square" size={24} /> 管理権限の付与完了を報告する
                                    </button>
                                ) : isInitialDone && (
                                    <button 
                                        onClick={() => openReportModal('initial')}
                                        className="w-full bg-gradient-to-r from-[#215387] to-[#3174b5] text-white py-5 rounded-[24px] font-black text-base md:text-lg shadow-xl shadow-blue-900/20 hover:translate-y-[-2px] transition-all flex items-center justify-center gap-4 active:scale-[0.98]"
                                    >
                                        <Icon name="send" size={24} /> 導入完了を報告する
                                    </button>
                                )}
                            </div>
                        </div>
                    )}

                    {/* Modal */}
                    {isModalOpen && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 modal-overlay">
                            <div className="bg-white w-full max-w-lg rounded-[48px] shadow-2xl overflow-hidden animate-in fade-in zoom-in duration-300 border border-slate-100">
                                <div className="bg-[#f8fafc] px-10 py-7 flex justify-between items-center border-b border-slate-100">
                                    <h3 className="text-[#215387] font-black text-xl flex items-center gap-3 leading-none uppercase tracking-tight">
                                        <Icon name="mail" /> {reportType === 'final' ? 'Host Final Report' : 'Host Deployment Report'}
                                    </h3>
                                    <button onClick={() => setIsModalOpen(false)} className="text-slate-300 hover:text-slate-600 p-2 leading-none transition-colors">
                                        <Icon name="x" size={28} />
                                    </button>
                                </div>
                                <div className="p-10 max-h-[75vh] overflow-y-auto scrollbar-thin space-y-8">
                                    
                                    <div className="bg-slate-50/50 p-6 rounded-[32px] border border-slate-100">
                                        <p className="text-[10px] font-black text-slate-300 uppercase mb-3 tracking-widest leading-none">Host & Property Info</p>
                                        <p className="text-base font-black text-slate-800 leading-tight">{formData.propertyName || "物件名未入力"}</p>
                                        <p className="text-xs font-bold text-slate-400 mt-2 tracking-wide">{formData.subscriberName} / {formData.staffName}</p>
                                    </div>

                                    {reportType === 'initial' && (
                                        <React.Fragment>
                                            <div className="space-y-5">
                                                <p className="text-[10px] font-black text-slate-300 uppercase tracking-widest leading-none">Camera Counts</p>
                                                <div className="grid grid-cols-2 gap-4">
                                                    <div className="bg-white p-5 rounded-[24px] border border-slate-100 shadow-sm">
                                                        <label className="block text-[10px] font-bold text-slate-400 mb-2 leading-none">屋内台数</label>
                                                        <input type="number" min="0" value={formData.indoorCount} onChange={e => setFormData({...formData, indoorCount: e.target.value})} className="w-full bg-slate-50/50 border border-slate-100 rounded-xl px-2 py-3 text-center font-black text-lg outline-none text-[#215387]" />
                                                    </div>
                                                    <div className="bg-white p-5 rounded-[24px] border border-slate-100 shadow-sm">
                                                        <label className="block text-[10px] font-bold text-slate-400 mb-2 leading-none">屋外台数</label>
                                                        <input type="number" min="0" value={formData.outdoorCount} onChange={e => setFormData({...formData, outdoorCount: e.target.value})} className="w-full bg-slate-50/50 border border-slate-100 rounded-xl px-2 py-3 text-center font-black text-lg outline-none text-[#215387]" />
                                                    </div>
                                                </div>
                                                <div className="bg-[#215387] p-5 rounded-[24px] flex justify-between items-center text-white shadow-lg shadow-blue-900/20">
                                                    <span className="text-[10px] font-black uppercase tracking-widest">Total Cameras</span>
                                                    <span className="text-2xl font-black">{totalCameras} <span className="text-sm font-bold opacity-80 uppercase ml-1">Unit</span></span>
                                                </div>
                                            </div>

                                            <div className="space-y-4">
                                                <p className="text-[10px] font-black text-slate-300 uppercase tracking-widest leading-none">Account Credentials</p>
                                                <div className="bg-white border border-slate-100 p-6 rounded-[32px] space-y-5 shadow-sm">
                                                    <div>
                                                        <label className="block text-[10px] font-black text-slate-400 mb-2 uppercase tracking-widest">TP-Link ID</label>
                                                        <input type="email" value={formData.tpLinkId} onChange={e => setFormData({...formData, tpLinkId: e.target.value})} className="w-full bg-slate-50/50 border border-slate-100 rounded-2xl px-4 py-4 font-bold text-slate-700 outline-none" placeholder="example@gmail.com" />
                                                    </div>
                                                    <div>
                                                        <label className="block text-[10px] font-black text-slate-400 mb-2 uppercase tracking-widest">Password</label>
                                                        <input type="text" value={formData.password} onChange={e => setFormData({...formData, password: e.target.value})} className="w-full bg-slate-50/50 border border-slate-100 rounded-2xl px-4 py-4 font-bold text-slate-700 outline-none" />
                                                    </div>
                                                </div>
                                            </div>
                                        </React.Fragment>
                                    )}

                                    {reportType === 'final' && (
                                        <div className="p-8 bg-[#eef8ff] rounded-[32px] border border-blue-50">
                                            <p className="text-sm font-bold text-[#215387] leading-relaxed text-center">
                                                Tapoカメラの管理権限設定（共有）が<br/>完了したことを弊社へ報告します。
                                            </p>
                                        </div>
                                    )}

                                    <button 
                                        onClick={handleSendEmail}
                                        disabled={!formData.propertyName || (reportType === 'initial' && (!formData.tpLinkId || !formData.password))}
                                        className={`w-full py-6 rounded-[28px] font-black shadow-2xl transition-all disabled:bg-slate-100 disabled:text-slate-300 disabled:shadow-none text-white active:scale-[0.98] ${reportType === 'final' ? 'bg-[#0097e1] shadow-blue-500/20' : 'bg-[#215387] shadow-blue-900/20'}`}
                                    >
                                        報告メールを作成する
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
