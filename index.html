<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tapoカメラ導入チェックリスト</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans JP', -apple-system, sans-serif;
            background: #f0f4f8;
            color: #1e293b;
        }
        .progress-bar { transition: width 0.9s cubic-bezier(0.4, 0, 0.2, 1); }
        .card-hover { transition: box-shadow 0.2s ease, border-color 0.2s ease, transform 0.15s ease; }
        .card-hover:hover { transform: translateY(-1px); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const Icon = ({ name, size = 18, className = "" }) => {
            useEffect(() => {
                if (window.lucide) window.lucide.createIcons();
            });
            return <i data-lucide={name} style={{ width: size, height: size, display: 'inline-block', verticalAlign: 'middle' }} className={className}></i>;
        };

        const initialTaskData = [
            { id: 1, phase: 1, title: 'カメラ本体 (Tapo C410) のご購入', completed: false,
              description: 'バッテリー駆動の防犯カメラです。必要台数をお手配ください。',
              links: [{ label: '商品詳細を見る', url: 'https://www.tp-link.com/jp/home-networking/cloud-camera/tapo-c410/' }] },
            { id: 2, phase: 1, title: 'ソーラーパネル (Tapo A201) のご購入', completed: false,
              description: '屋外設置の場合は必須です。屋内設置のみの場合は任意となります。', isOptional: true,
              links: [{ label: '製品詳細を見る', url: 'https://www.tp-link.com/jp/home-networking/cloud-camera/tapo-a201/' }] },
            { id: 3, phase: 1, title: '適切なmicroSDカードのご準備', completed: false,
              description: '4GB〜512GB。※SAMSUNG/TOPESEL製は故障の原因となるため使用禁止です。', isCritical: true,
              links: [{ label: '互換性の詳細を確認', url: 'https://www.tp-link.com/support/faq/3048/' }] },
            { id: 4, phase: 1, title: '施工会社様へのご依頼・お手配', completed: false,
              description: '設置工事が必要な場合は、以下の提携先または任意の業者様へご連絡ください。',
              inquiryLinks: [
                { label: '株式会社大志 お問い合わせ', url: 'mailto:capital.design.chiba@gmail.com', icon: 'mail' },
                { label: '株式会社MarkAnt お問い合わせ', url: 'https://www.markant.jp/', icon: 'globe' }
              ]},
            { id: 5, phase: 2, title: 'Tapoアプリのインストール', completed: false,
              description: 'スマートフォンのストアからアプリをインストールしてください。',
              links: [
                { label: 'iOS (App Store)', url: 'https://apps.apple.com/jp/app/tp-link-tapo/id1472718009' },
                { label: 'Android (Google Play)', url: 'https://play.google.com/store/apps/details?id=com.tplink.iot' }
              ]},
            { id: 6, phase: 2, title: 'Wi-Fi環境のご確認', completed: false,
              description: '2.4GHz帯、WPA/WPA2、DHCP設定が有効であることをご確認ください。' },
            { id: 7, phase: 2, title: 'デバイスの登録・セットアップ', completed: false,
              description: 'アプリの指示に従い、カメラをネットワークに接続してください。',
              links: [{ label: 'セットアップ手順を確認', url: 'https://www.tapo.com/jp/faq/51/' }] },
            { id: 8, phase: 3, title: 'TapoCare サービスのご契約（必須）', completed: false,
              description: 'クラウドサービスをご利用いただくため、契約が必須となります。',
              links: [{ label: 'ご契約方法を確認', url: 'https://www.tp-link.com/jp/support/faq/3257/' }] },
            { id: 9, phase: 3, title: '管理権限の共有（ご案内後）', completed: false,
              description: '契約締結後、弊社よりご案内したタイミングで実施してください。', isConditional: true,
              links: [{ label: '共有手順を確認', url: 'https://www.tp-link.com/jp/support/faq/2613/' }] }
        ];

        const STEP_CONFIG = {
            1: { icon: 'shopping-cart', label: '物品のご準備・工事',  color: 'text-blue-500',   border: 'border-blue-200',   bg: 'bg-blue-50' },
            2: { icon: 'smartphone',    label: 'アプリ設定・設置',    color: 'text-indigo-400', border: 'border-indigo-200', bg: 'bg-indigo-50' },
            3: { icon: 'settings',      label: '運用・管理の開始',    color: 'text-slate-400',  border: 'border-slate-200',  bg: 'bg-slate-50' },
        };

        const App = () => {
            const [tasks, setTasks] = useState(() => {
                try {
                    const saved = JSON.parse(localStorage.getItem('tapo_checklist_v2') || '[]');
                    return initialTaskData.map(t => {
                        const s = saved.find(x => x.id === t.id);
                        return s ? { ...t, completed: s.completed } : t;
                    });
                } catch { return initialTaskData.map(t => ({ ...t })); }
            });

            useEffect(() => {
                localStorage.setItem('tapo_checklist_v2', JSON.stringify(tasks.map(t => ({ id: t.id, completed: t.completed }))));
                if (window.lucide) window.lucide.createIcons();
            }, [tasks]);

            const toggleTask = (id) => {
                setTasks(prev => prev.map(t => t.id === id ? { ...t, completed: !t.completed } : t));
            };

            const completed = tasks.filter(t => t.completed).length;
            const progress = Math.round((completed / tasks.length) * 100);

            return (
                <div className="max-w-2xl mx-auto px-4 py-8 md:py-12">

                    {/* ── ヘッダー ── */}
                    <header className="bg-white rounded-2xl px-6 py-5 mb-6 shadow-sm border border-slate-200">
                        <div className="flex items-start justify-between gap-4">
                            <div>
                                <h1 className="text-xl font-black text-slate-800 flex items-center gap-2 tracking-tight">
                                    <Icon name="shield-check" size={22} className="text-blue-500" />
                                    Tapoカメラ導入チェックリスト
                                </h1>
                                <p className="text-slate-400 mt-1 text-xs font-medium flex items-center gap-1.5">
                                    <Icon name="user-check" size={13} className="text-slate-300" />
                                    ホスト様用 進捗管理シート
                                </p>
                            </div>
                            <div className="text-right shrink-0">
                                <div className="text-[10px] text-slate-400 font-bold tracking-widest uppercase mb-1.5">Achievement</div>
                                <div className="flex items-center gap-2 justify-end">
                                    <div className="w-24 h-2 bg-slate-100 rounded-full overflow-hidden">
                                        <div className="h-full bg-blue-500 progress-bar rounded-full" style={{ width: `${progress}%` }}></div>
                                    </div>
                                    <span className="text-lg font-black text-blue-600 leading-none w-10 text-right">{progress}%</span>
                                </div>
                                <div className="text-[11px] text-slate-400 mt-1">{completed} / {tasks.length} 完了</div>
                            </div>
                        </div>
                    </header>

                    {/* ── 警告 ── */}
                    <div className="bg-red-50 border border-red-200 rounded-2xl px-5 py-4 mb-8 flex gap-3 items-start">
                        <Icon name="alert-triangle" size={18} className="text-red-400 shrink-0 mt-0.5" />
                        <div className="text-sm">
                            <p className="font-bold text-red-800 mb-0.5">microSDカードの厳重警告</p>
                            <p className="text-red-700 leading-relaxed text-xs font-medium">
                                <strong>SAMSUNG Evo Plus</strong> および <strong>TOPESEL</strong> 製カードは使用禁止です。互換性の問題により、カードおよび本体を破損する恐れがあります。
                            </p>
                        </div>
                    </div>

                    {/* ── ステップ ── */}
                    {[1, 2, 3].map(phase => {
                        const cfg = STEP_CONFIG[phase];
                        return (
                            <section key={phase} className="mb-10">
                                <div className={`flex items-center gap-2 mb-4 pb-2.5 border-b ${cfg.border}`}>
                                    <Icon name={cfg.icon} size={18} className={cfg.color} />
                                    <span className={`text-xs font-black tracking-widest uppercase ${cfg.color}`}>Step {phase}</span>
                                    <span className="text-sm font-bold text-slate-600 ml-1">{cfg.label}</span>
                                </div>

                                {tasks.filter(t => t.phase === phase).map(task => (
                                    <div key={task.id}
                                         onClick={() => toggleTask(task.id)}
                                         className={`card-hover rounded-xl border mb-3 cursor-pointer ${
                                             task.completed
                                                 ? 'bg-slate-50 border-slate-200 opacity-70'
                                                 : task.isCritical
                                                     ? 'bg-amber-50 border-amber-200'
                                                     : task.isConditional
                                                         ? 'bg-blue-50/60 border-blue-200'
                                                         : task.isOptional
                                                             ? 'bg-white border-dashed border-slate-200'
                                                             : 'bg-white border-slate-200 hover:border-blue-300 hover:shadow-md'
                                         }`}>
                                        <div className="flex gap-3 p-4">
                                            <div className="shrink-0 mt-0.5">
                                                {task.completed
                                                    ? <Icon name="check-circle" size={20} className="text-blue-400" />
                                                    : <Icon name="circle" size={20} className="text-slate-300" />
                                                }
                                            </div>
                                            <div className="flex-1 min-w-0">
                                                <div className="flex flex-wrap items-center gap-1.5 mb-1">
                                                    <span className={`font-bold text-sm leading-snug ${task.completed ? 'text-slate-500 line-through' : 'text-slate-800'}`}>
                                                        {task.title}
                                                    </span>
                                                    {task.isCritical && !task.completed &&
                                                        <span className="bg-red-100 text-red-600 text-[10px] px-2 py-0.5 rounded-full font-bold">重要</span>}
                                                    {task.isOptional && !task.completed &&
                                                        <span className="bg-slate-100 text-slate-500 text-[10px] px-2 py-0.5 rounded-full font-bold">任意</span>}
                                                    {task.isConditional && !task.completed &&
                                                        <span className="bg-blue-100 text-blue-500 text-[10px] px-2 py-0.5 rounded-full font-bold">案内後</span>}
                                                </div>
                                                <p className={`text-xs leading-relaxed ${task.completed ? 'text-slate-400' : 'text-slate-500'}`}>
                                                    {task.description}
                                                </p>

                                                {/* お問い合わせリンク */}
                                                {!task.completed && task.inquiryLinks && (
                                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-2 mt-3" onClick={e => e.stopPropagation()}>
                                                        {task.inquiryLinks.map((l, i) => (
                                                            <a key={i} href={l.url} target="_blank" rel="noopener noreferrer"
                                                               className="flex items-center justify-between px-3 py-2 bg-white border border-slate-200 rounded-lg text-xs font-bold text-slate-600 hover:border-blue-300 hover:text-blue-600 transition-colors">
                                                                <span className="flex items-center gap-1.5">
                                                                    <Icon name={l.icon === 'mail' ? 'mail' : 'globe'} size={13} className="text-blue-400" />
                                                                    {l.label}
                                                                </span>
                                                                <Icon name="external-link" size={11} className="text-slate-300" />
                                                            </a>
                                                        ))}
                                                    </div>
                                                )}

                                                {/* アクションボタン */}
                                                {!task.completed && task.links && (
                                                    <div className="flex flex-wrap gap-2 mt-3" onClick={e => e.stopPropagation()}>
                                                        {task.links.map((l, i) => (
                                                            <a key={i} href={l.url} target="_blank" rel="noopener noreferrer"
                                                               className={`inline-flex items-center gap-1.5 text-white text-xs px-4 py-2 rounded-lg font-bold transition-colors shadow-sm ${task.isOptional ? 'bg-slate-400 hover:bg-slate-500' : 'bg-blue-600 hover:bg-blue-700'}`}>
                                                                <Icon name={task.id === 5 ? 'smartphone' : 'external-link'} size={12} />
                                                                {l.label}
                                                            </a>
                                                        ))}
                                                    </div>
                                                )}
                                            </div>
                                        </div>
                                    </div>
                                ))}
                            </section>
                        );
                    })}

                    {/* ── フッター ── */}
                    <footer className="text-center text-xs text-slate-400 pb-20 mt-8 space-y-4">
                        <a href="https://www.tp-link.com/jp/support/faq/2742/" target="_blank" rel="noopener noreferrer"
                           className="inline-flex items-center gap-1.5 text-blue-500 font-bold hover:underline">
                            <Icon name="info" size={13} /> Tapoカメラに関するよくある質問 (FAQ)
                        </a>
                        <div className="space-y-1 mt-2">
                            <p className="flex items-center justify-center gap-1.5 text-slate-400">
                                <Icon name="cloud" size={11} /> チェック状況はお使いのブラウザに自動保存されます
                            </p>
                            <p className="opacity-40 tracking-widest font-black uppercase text-[9px]">Tapo Management Sheet v2.0</p>
                        </div>
                    </footer>
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
