<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tapoカメラ導入チェックリスト</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap');
        body { font-family: 'Noto Sans JP', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // 【カスタマイズ】Firebaseを使用する場合は、ここに設定情報を貼り付けて初期化してください。
        // 未設定の場合はブラウザのLocalStorageに保存されます。
        const firebaseConfig = null; 

        const initialTaskData = [
            { id: 1, phase: 1, title: 'カメラ本体 (Tapo C410) のご購入', completed: false, description: 'バッテリー駆動の防犯カメラです。必要台数をお手配ください。', links: [{ label: '商品詳細を見る', url: 'https://www.tp-link.com/jp/home-networking/cloud-camera/tapo-c410/' }] },
            { id: 2, phase: 1, title: 'ソーラーパネル (Tapo A201) のご購入', completed: false, description: '屋外設置の場合は必須です。', isOptional: true, links: [{ label: '製品詳細を見る', url: 'https://www.tp-link.com/jp/home-networking/cloud-camera/tapo-a201/' }] },
            { id: 3, phase: 1, title: '適切なmicroSDカードのご準備', completed: false, description: '4GB〜512GB。※SAMSUNG/TOPESEL製は故障の原因となるため使用禁止です。', isCritical: true, links: [{ label: '互換性の詳細を確認', url: 'https://www.tp-link.com/support/faq/3048/' }] },
            { id: 4, phase: 1, title: '施工会社様へのご依頼・お手配', completed: false, description: '設置工事が必要な場合は、以下の提携先または任意の業者様へご連絡ください。', inquiryLinks: [{ label: '株式会社大志 お問い合わせ', url: 'mailto:capital.design.chiba@gmail.com', icon: 'mail' }, { label: '株式会社MarkAnt お問い合わせ', url: 'https://www.markant.jp/', icon: 'globe' }] },
            { id: 5, phase: 2, title: 'Tapoアプリのインストール', completed: false, description: 'スマートフォンのストアからアプリをインストールしてください。', links: [{ label: 'iOS (App Store)', url: 'https://apps.apple.com/jp/app/tp-link-tapo/id1472718009' }, { label: 'Android (Google Play)', url: 'https://play.google.com/store/apps/details?id=com.tplink.iot' }] },
            { id: 6, phase: 2, title: 'Wi-Fi環境のご確認', completed: false, description: '2.4GHz帯、WPA/WPA2、DHCP設定が有効であることをご確認ください。' },
            { id: 7, phase: 2, title: 'デバイスの登録・セットアップ', completed: false, description: 'アプリの指示に従い、カメラをネットワークに接続してください。', links: [{ label: 'セットアップ手順を確認', url: 'https://www.tapo.com/jp/faq/51/' }] },
            { id: 8, phase: 3, title: 'TapoCare サービスのご契約（必須）', completed: false, description: 'クラウドサービスをご利用いただくため、契約が必須となります。こちらから手順をご確認ください。', links: [{ label: 'ご契約方法を確認', url: 'https://www.tp-link.com/jp/support/faq/3257/' }] },
            { id: 9, phase: 3, title: '管理権限の共有（ご案内後）', completed: false, description: '契約締結後、弊社よりご案内したタイミングで実施してください。', isConditional: true, links: [{ label: '共有手順を確認', url: 'https://www.tp-link.com/jp/support/faq/2613/' }] }
        ];

        const App = () => {
            const [tasks, setTasks] = useState(() => {
                const saved = localStorage.getItem('tapo_checklist_data');
                return saved ? JSON.parse(saved) : initialTaskData;
            });

            useEffect(() => {
                localStorage.setItem('tapo_checklist_data', JSON.stringify(tasks));
            }, [tasks]);

            const toggleTask = (id) => {
                setTasks(tasks.map(t => t.id === id ? { ...t, completed: !t.completed } : t));
            };

            const progress = Math.round((tasks.filter(t => t.completed).length / tasks.length) * 100);

            return (
                <div className="max-w-3xl mx-auto p-4 md:p-8 min-h-screen">
                    {/* ヘッダー */}
                    <header className="bg-white rounded-3xl p-6 shadow-sm mb-8 border border-gray-200">
                        <h1 className="text-2xl font-black text-gray-900 flex items-center gap-2">
                            <span className="text-blue-600">🛡️</span> Tapoカメラ導入チェックリスト
                        </h1>
                        <p className="text-gray-500 mt-1">ホスト様用 進捗管理シート</p>
                        <div className="mt-4 flex items-center gap-4 bg-gray-50 p-4 rounded-2xl">
                            <div className="flex-1 h-3 bg-gray-200 rounded-full overflow-hidden">
                                <div className="h-full bg-blue-500 transition-all duration-700 shadow-[0_0_10px_rgba(59,130,246,0.5)]" style={{ width: `${progress}%` }}></div>
                            </div>
                            <span className="text-xl font-black text-blue-600 w-12 text-right">{progress}%</span>
                        </div>
                    </header>

                    {/* 重要警告 */}
                    <div className="bg-red-50 border-l-4 border-red-500 p-5 rounded-r-xl mb-8 flex gap-4 items-start shadow-sm">
                        <span className="text-red-500 text-xl font-bold">⚠️</span>
                        <div className="text-sm">
                            <p className="font-bold text-red-900 mb-1 text-base">microSDカードの厳重警告</p>
                            <p className="text-red-800 leading-relaxed">
                                <strong>SAMSUNG Evo Plus</strong> および <strong>TOPESEL</strong> 製カードは使用禁止です。
                                カードおよび機器を破損する恐れがあります。
                            </p>
                        </div>
                    </div>

                    {/* ステップ別表示 */}
                    {[1, 2, 3].map(phase => (
                        <div key={phase} className="mb-10">
                            <h2 className="text-xl font-black mb-5 flex items-center gap-2 text-gray-700 border-b-2 border-gray-200 pb-2">
                                <span className="bg-gray-800 text-white text-xs px-2 py-1 rounded">STEP {phase}</span>
                                {phase === 1 ? '物品のご準備・工事' : phase === 2 ? 'アプリ設定・設置' : '運用・管理の開始'}
                            </h2>
                            {tasks.filter(t => t.phase === phase).map(task => (
                                <div key={task.id} 
                                     onClick={() => toggleTask(task.id)}
                                     className={`group p-5 rounded-2xl border-2 mb-4 cursor-pointer transition-all duration-300 ${
                                         task.completed 
                                         ? 'bg-green-50 border-green-200 opacity-80' 
                                         : task.isCritical 
                                           ? 'bg-amber-50 border-amber-300 shadow-sm' 
                                           : task.isConditional
                                             ? 'bg-blue-50 border-blue-200'
                                             : 'bg-white border-gray-100 hover:border-blue-300 hover:shadow-md'
                                     }`}>
                                    <div className="flex gap-4">
                                        <div className="text-2xl mt-1 select-none">
                                            {task.completed ? '✅' : '⚪'}
                                        </div>
                                        <div className="flex-1">
                                            <div className="flex flex-wrap items-center gap-2 mb-1">
                                                <span className={`font-bold text-lg ${task.completed ? 'text-green-800' : 'text-gray-900'}`}>{task.title}</span>
                                                {task.isCritical && !task.completed && <span className="bg-red-500 text-white text-[10px] px-2 py-1 rounded-full font-bold uppercase tracking-wider">重要</span>}
                                                {task.isOptional && !task.completed && <span className="bg-gray-400 text-white text-[10px] px-2 py-1 rounded-full font-bold uppercase tracking-wider">任意</span>}
                                                {task.isConditional && !task.completed && <span className="bg-blue-500 text-white text-[10px] px-2 py-1 rounded-full font-bold uppercase tracking-wider">案内待ち</span>}
                                            </div>
                                            <p className={`text-sm leading-relaxed ${task.completed ? 'text-green-600/70' : 'text-gray-500'}`}>{task.description}</p>
                                            
                                            {/* 施工会社お問い合わせ先 */}
                                            {!task.completed && task.inquiryLinks && (
                                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-2 mt-4" onClick={e => e.stopPropagation()}>
                                                    {task.inquiryLinks.map((l, i) => (
                                                        <a key={i} href={l.url} target="_blank" className="flex items-center justify-between px-4 py-2 bg-white border border-gray-200 rounded-xl font-bold text-xs text-gray-700 hover:bg-blue-50 hover:border-blue-200 transition-colors">
                                                            <span>{l.label}</span>
                                                            <span className="text-gray-300">↗</span>
                                                        </a>
                                                    ))}
                                                </div>
                                            )}

                                            {/* アクションリンク */}
                                            {!task.completed && task.links && (
                                                <div className="flex flex-wrap gap-2 mt-4" onClick={e => e.stopPropagation()}>
                                                    {task.links.map((l, i) => (
                                                        <a key={i} href={l.url} target="_blank" className="inline-flex items-center gap-2 bg-blue-600 text-white text-xs px-4 py-2 rounded-xl font-bold hover:bg-blue-700 transition-colors shadow-sm">
                                                            {l.label} <span>↗</span>
                                                        </a>
                                                    ))}
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                </div>
                            ))}
                        </div>
                    ))}
                    
                    <footer className="text-center text-xs text-gray-400 pb-20 mt-10 space-y-2">
                        <div className="flex justify-center gap-4 mb-4">
                            <a href="https://www.tp-link.com/jp/support/faq/2742/" target="_blank" className="hover:text-blue-500 underline">よくある質問（FAQ）</a>
                        </div>
                        <p>※チェック状況はお使いのブラウザに自動保存されます。</p>
                        <p className="opacity-50">Tapo Camera Deployment Tracker v1.2</p>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
